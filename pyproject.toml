[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gesture-canvas"
version = "0.2.1"
description = "A real-time gesture-controlled 2D and 3D drawing canvas."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "mediapipe>=0.10.14,<0.11",
    "numpy>=1.26,<3",
    "opencv-contrib-python>=4.10,<6",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[project.scripts]
gesture-canvas = "gesture_canvas.app:main"

[tool.setuptools.packages.find]
include = ["gesture_canvas*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
